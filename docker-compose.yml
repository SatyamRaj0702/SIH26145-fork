services:
  detector-api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID:-}
      APPWRITE_ALERTS_COLLECTION_ID: ${APPWRITE_ALERTS_COLLECTION_ID:-}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-45}
    command: >-
      sh -c "pip install -e 'backend[test]' &&
      uvicorn sih_detector.api:app --app-dir backend/src --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  dashboard:
    image: node:22-slim
    working_dir: /workspace/frontend1
    volumes:
      - .:/workspace
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-me}
      AUTH_URL: ${AUTH_URL:-http://localhost:5173}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - detector-api
